[project]
name = "claude-window-starter"
version = "0.1.0"
description = "Secure scheduled Claude Code subscription request runner"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-window-starter = "claude_starter.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]
ignore = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["backend/claude_starter"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B603", "B607"]
