name: Draft release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify version consistency
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          app = plistlib.loads(pathlib.Path('macos-app/Resources/Info.plist').read_bytes())['CFBundleShortVersionString']
          backend = re.search(r'__version__ = "([^"]+)"', pathlib.Path('backend/claude_starter/__init__.py').read_text()).group(1)
          assert version == app == backend, 'Package/app/backend versions differ'
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version)
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF'] == f'v{version}', 'Tag/version mismatch'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_VERSION={version}\n')
          PY
      - name: Install quality tools
        run: python3 -m pip install -r requirements-dev.lock
      - name: Quality checks and build
        run: |
          ruff format --check backend tests scripts/security_scan.py
          ruff check backend tests scripts/security_scan.py
          mypy backend/claude_starter
          bandit -q -lll -r backend
          for file in scripts/*.sh scripts/*.command; do bash -n "$file"; done
          ./scripts/build-local.sh
          PYTHONPATH=backend python3 scripts/verify-installation.py --app "dist/Claude Window Starter.app"
      - name: Build ad-hoc candidate installer
        if: vars.RELEASE_SIGNING_ENABLED != 'true'
        run: ./scripts/build-distribution.sh release-assets
      - name: Build Developer ID signed and notarized installer
        if: vars.RELEASE_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/build-signed-distribution.sh release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.runner }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Package source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="claude-code-window-starter-${RELEASE_TAG}/" -o "release-assets/claude-code-window-starter-${RELEASE_TAG}-source.tar.gz" HEAD
          cd release-assets
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "Claude Code Window Starter $RELEASE_TAG — release candidate" --notes-file docs/RELEASE_NOTES_TEMPLATE.md
