name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned quality tools
        run: python -m pip install -r requirements-dev.lock
      - name: Compile and unit tests
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Lint and type check
        run: |
          ruff format --check backend tests scripts/security_scan.py
          ruff check backend tests scripts/security_scan.py
          mypy backend/claude_starter
      - name: Security checks
        run: |
          bandit -q -lll -r backend
          python scripts/security_scan.py
      - name: Build and install wheel
        run: |
          python -m build --wheel --no-isolation
          python -m venv /tmp/claude-window-starter-wheel
          /tmp/claude-window-starter-wheel/bin/pip install --no-index dist/*.whl
          /tmp/claude-window-starter-wheel/bin/claude-window-starter --home /tmp/cws --json version
      - name: Architecture paths
        env:
          PYTHONPATH: backend
        run: python -m unittest tests.test_health_architecture
      - name: systemd units
        run: systemd-analyze verify systemd/*.service systemd/*.timer

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Swift build and tests
        run: swift test --package-path macos-app
      - name: Build signed local app bundle
        run: scripts/build-macos-app.sh dist
      - name: launchd plist
        run: |
          plutil -lint launchd/com.claude-window-starter.background.plist
          plutil -lint macos-app/Resources/Info.plist
      - name: Shell syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
